apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cloud-native-book
  name: cloud-native-book
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-native-book
  template:
    metadata:
      labels:
        app: cloud-native-book
    spec:
      containers:
        - image: nginx
          name: nginx
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: 0.25
              memory: 32Mi
            requests:
              cpu: 0.25
              memory: 32Mi
